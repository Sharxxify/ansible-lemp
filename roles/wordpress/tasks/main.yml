---
- name: Install required packages
  apt:
    name:
      - php8.1-xml
      - php8.1-gd
      - php8.1-zip
      - unzip
      - curl
    state: present
    update_cache: yes
  become: yes

- name: Create WordPress database
  mysql_db:
    name: "{{ wp_db_name }}"
    state: present
    login_user: root
    login_password: "StrongPass@123"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: yes

- name: Create WordPress DB user
  mysql_user:
    name: "{{ wp_db_user }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "StrongPass@123"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: yes

- name: Download WordPress
  get_url:
    url: https://wordpress.org/latest.tar.gz
    dest: /tmp/wordpress.tar.gz
  become: yes

- name: Extract WordPress
  unarchive:
    src: /tmp/wordpress.tar.gz
    dest: /tmp/
    remote_src: yes
  become: yes

- name: Copy WordPress files to web root
  shell: cp -r /tmp/wordpress/. /var/www/html/
  become: yes

- name: Deploy wp-config.php
  template:
    src: wp-config.php.j2
    dest: /var/www/html/wp-config.php
  become: yes

- name: Set correct ownership
  file:
    path: /var/www/html
    owner: www-data
    group: www-data
    recurse: yes
    state: directory
  become: yes

- name: Set correct permissions on files
  shell: find /var/www/html -type f -exec chmod 644 {} \;
  become: yes

- name: Set correct permissions on directories
  shell: find /var/www/html -type d -exec chmod 755 {} \;
  become: yes
